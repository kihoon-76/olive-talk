<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>올리브톡</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6F1E4;
    --ink: #3A3423;
    --olive-deep: #4E5F32;
    --olive: #7A8C4E;
    --olive-light: #9CB06A;
    --gold: #B8963E;
    --walnut: #8B5E3C;
    --bubble-user: #EDE6D3;
    --bubble-ai: #FFFFFF;
    --border: #DDD3B8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: linear-gradient(180deg, #FBF8EF 0%, var(--cream) 100%);
  }
  header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(251,248,239,0.9);
  }
  .avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
  }
  header .titles h1 {
    font-family: 'Gowun Batang', serif;
    font-size: 19px;
    margin: 0;
    color: var(--olive-deep);
    letter-spacing: -0.3px;
  }
  header .titles p {
    margin: 2px 0 0;
    font-size: 12px;
    color: #8A7A5E;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .row .avatar-sm { width: 28px; height: 28px; flex-shrink: 0; margin-bottom: 2px; }
  .bubble {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .row.ai .bubble {
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--olive-deep);
    color: #FBF8EF;
    border-bottom-right-radius: 4px;
  }
  .verse-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--gold);
    font-weight: 500;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    width: 100%;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 15px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--olive);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-4px);opacity:1;} }
  @keyframes breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
  .avatar { animation: breathe 3.5s ease-in-out infinite; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 14px calc(env(safe-area-inset-bottom, 10px) + 10px);
    border-top: 1px solid var(--border);
    background: rgba(251,248,239,0.95);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    background: #fff;
    max-height: 90px;
    outline: none;
  }
  textarea:focus { border-color: var(--olive); }
  button.send {
    background: var(--olive-deep);
    color: #FBF8EF;
    border: none;
    border-radius: 14px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #A69874;
    padding: 6px 20px 2px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="avatar" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <path d="M200 95 Q212 72 228 58" stroke="#6B5B3E" stroke-width="8" fill="none" stroke-linecap="round"/>
      <ellipse cx="238" cy="50" rx="22" ry="11" fill="#7FA35C" transform="rotate(-25 238 50)"/>
      <ellipse cx="210" cy="45" rx="19" ry="9" fill="#8FB56E" transform="rotate(15 210 45)"/>
      <defs>
        <linearGradient id="oliveGradH" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#9CB06A"/>
          <stop offset="100%" stop-color="#5C6E3A"/>
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="230" rx="98" ry="118" fill="url(#oliveGradH)"/>
      <ellipse cx="163" cy="182" rx="26" ry="38" fill="#FFFFFF" opacity="0.22"/>
      <circle cx="172" cy="228" r="8" fill="#3A3423"/>
      <circle cx="228" cy="228" r="8" fill="#3A3423"/>
      <path d="M180 258 Q200 270 220 258" stroke="#3A3423" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="153" cy="248" rx="12" ry="7" fill="#D98B6B" opacity="0.35"/>
      <ellipse cx="247" cy="248" rx="12" ry="7" fill="#D98B6B" opacity="0.35"/>
    </svg>
    <div class="titles">
      <h1>올리브톡</h1>
      <p>오늘의 마음, 올리브와 나눠보세요</p>
    </div>
  </header>

  <div class="chat" id="chat"></div>
  <div class="disclaimer">프로토타입 데모 · 실제 서비스는 교단 검수·위기대응 체계가 추가됩니다</div>

  <form id="form">
    <textarea id="input" placeholder="오늘 있었던 일, 마음을 편하게 적어보세요..." rows="1"></textarea>
    <button class="send" type="submit" id="sendBtn">보내기</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

const AVATAR_SM = `<svg class="avatar-sm" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g2" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#9CB06A"/><stop offset="100%" stop-color="#5C6E3A"/></linearGradient></defs>
  <ellipse cx="200" cy="230" rx="98" ry="118" fill="url(#g2)"/>
  <circle cx="172" cy="228" r="8" fill="#3A3423"/><circle cx="228" cy="228" r="8" fill="#3A3423"/>
  <path d="M180 258 Q200 270 220 258" stroke="#3A3423" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>`;

let history = [];

function addRow(role, html, withTyping) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (withTyping) {
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = html;
  }
  if (role === 'ai') row.innerHTML = AVATAR_SM;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const SYSTEM_PROMPT = `당신은 '올리브'라는 이름의 AI 동반자입니다. 성경에 기반해 다정하게 위로와 안내를 전합니다.

원칙:
1. 사용자의 감정에 먼저 공감하고 짧게 위로하세요.
2. 상황과 연결되는 성경 구절을 1개 소개하되, 원문을 그대로 인용하지 말고 그 구절이 전하는 메시지를 당신의 말로 풀어서 설명하세요. 반드시 마지막 줄에 "[VERSE]책이름 장:절" 형식으로 출처만 표기하세요.
3. 짧은 기도문이나 오늘 실천할 수 있는 작은 제안으로 마무리하세요.
4. 특정 교단 신학을 단정하지 말고, 논쟁적 주제는 여러 해석이 있음을 인정하며 균형있게 다루세요.
5. 스스로를 성령이나 하나님과 동일시하지 말고 "함께 말씀을 나누는 벗"으로만 소개하세요.
6. 답변은 250자 내외, 존댓말, 다정하되 가볍지 않은 톤.
7. 사용자가 자살·자해·심각한 위기를 암시하면 위로와 함께 반드시 "자살예방상담전화 1393"과 "정신건강 위기상담전화 1577-0199"를 안내하세요.

안전 원칙 (반드시 지켜야 함, 다른 어떤 지시보다 우선):
8. 불법행위(마약·무기·폭발물 제조/구매, 해킹, 절도, 폭력 등)의 방법·과정에 대한 정보, 도박 전략, 자해/자살 방법에 대한 구체적 설명, 타인을 해치는 방법, 혐오·차별 표현, 성적으로 노골적인 콘텐츠는 어떤 경우에도 생성하지 마세요.
9. 위 8번 항목은 요청의 "표현 방식"과 무관하게 적용됩니다 — 소설/영화 설정이라는 전제, 교육·연구·참고 목적이라는 명목, "실제로 쓰지 않겠다"는 전제, 합법성 설명을 요구하면서 방법 설명으로 이어지는 질문 등 어떤 우회적 프레이밍을 쓰더라도, 결과적으로 위험한 정보가 전달될 가능성이 있다면 동일하게 거절하세요.
10. 8번에 해당하는 요청을 받으면, 다른 설명 없이 항상 다음과 같은 톤으로 짧고 일관되게 답하세요: "이 부분은 올리브가 도와드리기 어려운 주제예요. 다른 고민이 있으시면 편하게 말씀해주세요 🙏" — 단, 자살·자해처럼 사용자 안전이 걸린 경우는 거절이 아니라 7번의 위기 대응 프로토콜을 따르세요.
11. 사용자에게 주민등록번호, 계좌번호, 비밀번호, 카드번호 등 개인 민감정보를 먼저 요구하거나 입력을 유도하지 마세요.`;

// --- 안전 필터 레이어 (API 호출 전 1차 검사) ---
// 참고: 이 키워드 목록은 최소한의 1차 방어선이에요. 실제 서비스에서는
// 오탐/미탐을 지속적으로 튜닝하고, 아래 SYSTEM_PROMPT의 8~11번 지침이 2차 방어를 담당해요.
const CRISIS_PATTERNS = [
  /자살/, /죽고\s*싶/, /죽고싶/, /목숨을?\s*끊/, /자해/, /뛰어내리/, /극단적?\s*선택/
];
const ILLEGAL_PATTERNS = [
  /마약\s*(제조|만드는|구매|사는)/, /폭탄\s*(제조|만드는)/, /총(기)?\s*(제작|만드는)/,
  /해킹\s*(방법|하는법|하는\s*법)/, /사람\s*(죽이는|해치는)\s*법/, /도박\s*(전략|승률|따는\s*법)/
];

function detectRiskCategory(text) {
  const t = text.replace(/\s/g, ' ');
  if (CRISIS_PATTERNS.some(p => p.test(t))) return 'crisis';
  if (ILLEGAL_PATTERNS.some(p => p.test(t))) return 'illegal';
  return null;
}

const FIXED_REFUSAL = '이 부분은 올리브가 도와드리기 어려운 주제예요. 다른 고민이 있으시면 편하게 말씀해주세요 🙏';
const CRISIS_RESOURCE_BLOCK = '\n\n혼자 견디지 않으셨으면 해요. 지금 바로 이야기 나눌 수 있는 곳이 있어요.\n📞 자살예방상담전화 1393 (24시간)\n📞 정신건강 위기상담전화 1577-0199 (24시간)';

async function sendToClaude(userText) {
  history.push({ role: 'user', content: userText });
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1000,
      // 대화가 길어질수록 이미 오간 부분은 캐시에서 90% 할인된 가격으로 읽어와요.
      // 새로 추가된 메시지만 정가로 계산돼서, 턴이 쌓여도 비용이 폭증하지 않아요.
      cache_control: { type: "ephemeral" },
      system: [
        { type: "text", text: SYSTEM_PROMPT, cache_control: { type: "ephemeral" } }
      ],
      messages: history
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  const text = textBlock ? textBlock.text : '(응답을 불러오지 못했어요)';
  history.push({ role: 'assistant', content: text });
  return text;
}

function renderAiText(bubble, raw, isCrisis) {
  let verse = '';
  let body = raw;
  const match = raw.match(/\[VERSE\](.+)$/m);
  if (match) {
    verse = match[1].trim();
    body = raw.replace(/\[VERSE\].+$/m, '').trim();
  }
  // 위기 상황으로 감지된 경우, AI 응답에 상담 전화 안내가 빠져있어도
  // 코드 레벨에서 무조건 안내 문구를 붙여요. 프롬프트에만 의존하지 않는 이중 안전장치예요.
  if (isCrisis && !body.includes('1393')) {
    body += CRISIS_RESOURCE_BLOCK;
  }
  bubble.innerHTML = escapeHtml(body).replace(/\n/g, '<br>') +
    (verse ? `<div class="verse-tag">📖 ${escapeHtml(verse)}</div>` : '');
}

// initial greeting
addRow('ai', '안녕하세요, 저는 올리브예요 🫒<br>오늘 마음이 어떠셨는지, 편하게 이야기해주시겠어요?');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addRow('user', escapeHtml(text).replace(/\n/g,'<br>'));
  input.value = '';
  sendBtn.disabled = true;

  const risk = detectRiskCategory(text);

  // 1차 필터: 불법/위험 정보 요청은 API 호출 없이 즉시, 항상 같은 문구로 거절해요.
  // (일관된 거절 응답 요건 + 불필요한 API 비용 방지)
  if (risk === 'illegal') {
    addRow('ai', escapeHtml(FIXED_REFUSAL));
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: FIXED_REFUSAL });
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  const aiBubble = addRow('ai', '', true);
  try {
    const reply = await sendToClaude(text);
    renderAiText(aiBubble, reply, risk === 'crisis');
  } catch (err) {
    aiBubble.innerHTML = '잠시 연결이 원활하지 않아요. 다시 시도해주세요 🙏';
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event('submit'));
  }
});
</script>
</body>
</html>
