<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E5F32">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>올리브톡</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --cream: #F6F1E4;
    --ink: #3A3423;
    --olive-deep: #4E5F32;
    --olive: #7A8C4E;
    --olive-light: #9CB06A;
    --gold: #B8963E;
    --walnut: #8B5E3C;
    --bubble-user: #EDE6D3;
    --bubble-ai: #FFFFFF;
    --border: #DDD3B8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior-y: contain; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: linear-gradient(180deg, #FBF8EF 0%, var(--cream) 100%);
  }
  header {
    padding: 16px 18px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(251,248,239,0.9);
    flex-shrink: 0;
  }
  .avatar {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
  }
  header .titles h1 {
    font-family: 'Gowun Batang', serif;
    font-size: 19px;
    margin: 0;
    color: var(--olive-deep);
    letter-spacing: -0.3px;
  }
  header .titles p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: #8A7A5E;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .row { display: flex; gap: 7px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .row .avatar-sm { width: 28px; height: 28px; flex-shrink: 0; margin-bottom: 2px; }
  .bubble {
    max-width: 80%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .row.ai .bubble {
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--olive-deep);
    color: #FBF8EF;
    border-bottom-right-radius: 4px;
  }
  .verse-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gold);
    font-weight: 500;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    width: 100%;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 15px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--olive);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-4px);opacity:1;} }
  @keyframes breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
  .avatar { animation: breathe 3.5s ease-in-out infinite; }

  form {
    display: flex;
    gap: 7px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 8px) + 8px);
    border-top: 1px solid var(--border);
    background: rgba(251,248,239,0.95);
    flex-shrink: 0;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    background: #fff;
    max-height: 90px;
    outline: none;
  }
  textarea:focus { border-color: var(--olive); }
  button.send {
    background: var(--olive-deep);
    color: #FBF8EF;
    border: none;
    border-radius: 13px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    touch-action: manipulation;
    min-height: 44px;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }

  .voice-toggle {
    margin-left: auto; background: none; border: none; font-size: 19px; cursor: pointer;
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    touch-action: manipulation;
  }
  .voice-toggle.muted { opacity: 0.4; }

  button.mic {
    background: #fff; border: 1.5px solid var(--border); color: var(--ink);
    border-radius: 13px; width: 46px; flex-shrink: 0; font-size: 18px; cursor: pointer;
    touch-action: manipulation; min-height: 44px;
  }
  button.mic.listening {
    background: #E9CFC2; border-color: var(--walnut);
    animation: micPulse 1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(139,94,60,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(139,94,60,0); }
  }

  .wake-bar {
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    background: rgba(251,248,239,0.85);
    flex-shrink: 0;
  }
  .wake-mode-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #fff; border: 1.5px solid var(--olive-light); color: var(--olive-deep);
    border-radius: 999px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; width: 100%; touch-action: manipulation; min-height: 40px;
  }
  .wake-mode-btn.active {
    background: var(--olive-deep); color: #FBF8EF; border-color: var(--olive-deep);
  }
  .wake-mode-btn.listening {
    animation: micPulse 1.2s ease-in-out infinite;
  }
  .wake-status { font-size: 12px; color: var(--gold); text-align: center; min-height: 16px; font-weight: 600; }
  .wake-help {
    font-size: 12px; color: var(--walnut); text-align: center; line-height: 1.4;
    background: #FBF0EC; border-radius: 8px; padding: 6px 8px;
  }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #A69874;
    padding: 4px 20px 2px;
    flex-shrink: 0;
  }

  .inapp-banner {
    display: none; /* JS로 카카오톡 브라우저 감지되면 flex로 바뀜 */
    flex-direction: column; gap: 8px;
    background: #4E5F32; color: #FBF8EF;
    padding: 12px 16px; text-align: center; flex-shrink: 0;
  }
  .inapp-banner p { margin: 0; font-size: 13.5px; line-height: 1.5; }
  .inapp-banner button {
    background: #FBF8EF; color: var(--olive-deep); border: none; border-radius: 999px;
    padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; touch-action: manipulation;
  }
</style>
</head>
<body>
<div class="app">
  <div class="inapp-banner" id="inappBanner">
    <p>🎤 음성 기능은 카카오톡 브라우저에서 잘 안 될 수 있어요.<br>아래 버튼으로 <b>일반 브라우저</b>에서 열어주세요.</p>
    <button id="openExternalBtn" type="button">🌐 다른 브라우저로 열기</button>
  </div>
  <header>
    <svg class="avatar" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <path d="M200 95 Q212 72 228 58" stroke="#6B5B3E" stroke-width="8" fill="none" stroke-linecap="round"/>
      <ellipse cx="238" cy="50" rx="22" ry="11" fill="#7FA35C" transform="rotate(-25 238 50)"/>
      <ellipse cx="210" cy="45" rx="19" ry="9" fill="#8FB56E" transform="rotate(15 210 45)"/>
      <defs>
        <linearGradient id="oliveGradH" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#9CB06A"/>
          <stop offset="100%" stop-color="#5C6E3A"/>
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="230" rx="98" ry="118" fill="url(#oliveGradH)"/>
      <ellipse cx="163" cy="182" rx="26" ry="38" fill="#FFFFFF" opacity="0.22"/>
      <circle cx="172" cy="228" r="8" fill="#3A3423"/>
      <circle cx="228" cy="228" r="8" fill="#3A3423"/>
      <path d="M180 258 Q200 270 220 258" stroke="#3A3423" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="153" cy="248" rx="12" ry="7" fill="#D98B6B" opacity="0.35"/>
      <ellipse cx="247" cy="248" rx="12" ry="7" fill="#D98B6B" opacity="0.35"/>
    </svg>
    <div class="titles">
      <h1>올리브톡</h1>
      <p>오늘의 마음, 올리브와 나눠보세요</p>
    </div>
    <button id="voiceToggle" class="voice-toggle" type="button" title="음성 응답 켜기/끄기">🔊</button>
  </header>

  <div class="wake-bar">
    <button id="wakeModeBtn" type="button" class="wake-mode-btn">👂 "안녕 올리브"로 시작하기</button>
    <span class="wake-status" id="wakeStatus"></span>
    <p class="wake-help" id="wakeHelp">🎤 버튼을 누르고 "허용"을 눌러주세요. 그다음 "안녕 올리브"라고 불러보세요.</p>
  </div>

  <div class="chat" id="chat"></div>
  <div class="disclaimer">프로토타입 데모 · 실제 서비스는 교단 검수·위기대응 체계가 추가됩니다</div>

  <form id="form">
    <button class="mic" type="button" id="micBtn" title="음성으로 말하기">🎤</button>
    <textarea id="input" placeholder="마음을 편하게 적어보세요..." rows="1"></textarea>
    <button class="send" type="submit" id="sendBtn">보내기</button>
  </form>
</div>

<script>
// 카카오톡 내장 브라우저 감지 — 음성 기능이 불안정해서, 자동으로 일반 브라우저로 넘겨요.
(function() {
  const isKakaoInApp = /KAKAOTALK/i.test(navigator.userAgent || '');
  if (!isKakaoInApp) return;
  const banner = document.getElementById('inappBanner');
  banner.style.display = 'flex';

  const externalUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);

  // 사용자가 버튼을 누르지 않아도, 페이지에 들어오자마자 자동으로 한 번 시도해요.
  location.href = externalUrl;

  // 자동 전환이 막힌 환경(일부 iOS 설정 등)을 위해, 버튼도 그대로 남겨둬요.
  document.getElementById('openExternalBtn').addEventListener('click', () => {
    location.href = externalUrl;
  });
})();

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

const AVATAR_SM = `<svg class="avatar-sm" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g2" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#9CB06A"/><stop offset="100%" stop-color="#5C6E3A"/></linearGradient></defs>
  <ellipse cx="200" cy="230" rx="98" ry="118" fill="url(#g2)"/>
  <circle cx="172" cy="228" r="8" fill="#3A3423"/><circle cx="228" cy="228" r="8" fill="#3A3423"/>
  <path d="M180 258 Q200 270 220 258" stroke="#3A3423" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>`;

let history = [];

function addRow(role, html, withTyping) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (withTyping) {
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = html;
  }
  if (role === 'ai') row.innerHTML = AVATAR_SM;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Supabase 연동 (Edge Function을 통해 안전하게 AI 호출) ---
// 이 키는 "공개용(publishable)" 키라 노출돼도 안전해요. 실제 Anthropic API 키는
// Edge Function 서버 안에만 있고, 여기서는 절대 볼 수 없어요.
const SUPABASE_URL = 'https://lovyadxzfsvccjknvrzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VYij2JgCTIEPkNgs-0rCmQ_Cq2r-XSf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- 안전 필터 레이어 (Edge Function 호출 전 1차 검사) ---
// 참고: 이 키워드 목록은 최소한의 1차 방어선이에요. Edge Function 안의 시스템
// 프롬프트(8~11번 지침)가 2차 방어를 담당해요.
const CRISIS_PATTERNS = [
  /자살/, /죽고\s*싶/, /죽고싶/, /목숨을?\s*끊/, /자해/, /뛰어내리/, /극단적?\s*선택/
];
const ILLEGAL_PATTERNS = [
  /마약\s*(제조|만드는|구매|사는)/, /폭탄\s*(제조|만드는)/, /총(기)?\s*(제작|만드는)/,
  /해킹\s*(방법|하는법|하는\s*법)/, /사람\s*(죽이는|해치는)\s*법/, /도박\s*(전략|승률|따는\s*법)/
];

function detectRiskCategory(text) {
  const t = text.replace(/\s/g, ' ');
  if (CRISIS_PATTERNS.some(p => p.test(t))) return 'crisis';
  if (ILLEGAL_PATTERNS.some(p => p.test(t))) return 'illegal';
  return null;
}

const FIXED_REFUSAL = '이 부분은 올리브가 도와드리기 어려운 주제예요. 다른 고민이 있으시면 편하게 말씀해주세요 🙏';
const CRISIS_RESOURCE_BLOCK = '\n\n혼자 견디지 않으셨으면 해요. 지금 바로 이야기 나눌 수 있는 곳이 있어요.\n📞 자살예방상담전화 1393 (24시간)\n📞 정신건강 위기상담전화 1577-0199 (24시간)';

async function sendToClaude(userText) {
  history.push({ role: 'user', content: userText });

  // 테스트 기간 동안은 로그인 없이 바로 대화 가능하게 해요.
  // (Edge Function 호출 자체는 공개 키로도 인증되니 로그인이 필수는 아니에요.)
  const { data, error } = await sb.functions.invoke('olive-chat', {
    body: { messages: history },
  });

  if (error) throw error;
  if (data.error) throw new Error(data.error);

  const textBlock = (data.content || []).find(b => b.type === 'text');
  const text = textBlock ? textBlock.text : '(응답을 불러오지 못했어요)';
  history.push({ role: 'assistant', content: text });
  return text;
}

function renderAiText(bubble, raw, isCrisis) {
  let verse = '';
  let body = raw;
  const match = raw.match(/\[VERSE\](.+)$/m);
  if (match) {
    verse = match[1].trim();
    body = raw.replace(/\[VERSE\].+$/m, '').trim();
  }
  // 위기 상황으로 감지된 경우, AI 응답에 상담 전화 안내가 빠져있어도
  // 코드 레벨에서 무조건 안내 문구를 붙여요. 프롬프트에만 의존하지 않는 이중 안전장치예요.
  if (isCrisis && !body.includes('1393')) {
    body += CRISIS_RESOURCE_BLOCK;
  }
  bubble.innerHTML = escapeHtml(body).replace(/\n/g, '<br>') +
    (verse ? `<div class="verse-tag">📖 ${escapeHtml(verse)}</div>` : '');

  // 음성으로 읽을 때는 전화번호 안내 블록 이모지 등은 자연스럽게 생략하고, 본문 + 출처만 읽어요.
  return verse ? `${body} 관련 말씀은 ${verse} 입니다.` : body;
}

// initial greeting
const GREETING_TEXT = '안녕하세요, 저는 올리브예요. 오늘 마음이 어떠셨는지, 편하게 이야기해주시겠어요?';
addRow('ai', '안녕하세요, 저는 올리브예요 🫒<br>오늘 마음이 어떠셨는지, 편하게 이야기해주시겠어요?');
setTimeout(() => speakText(GREETING_TEXT), 400); // 음성 목록 로딩 시간을 살짝 기다려요

// (테스트 기간: 로그인 요구를 잠시 꺼뒀어요. 필요해지면 ensureSession()을 다시 호출하면 돼요.)

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addRow('user', escapeHtml(text).replace(/\n/g,'<br>'));
  input.value = '';
  sendBtn.disabled = true;

  const risk = detectRiskCategory(text);

  // 1차 필터: 불법/위험 정보 요청은 API 호출 없이 즉시, 항상 같은 문구로 거절해요.
  // (일관된 거절 응답 요건 + 불필요한 API 비용 방지)
  if (risk === 'illegal') {
    addRow('ai', escapeHtml(FIXED_REFUSAL));
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: FIXED_REFUSAL });
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  const aiBubble = addRow('ai', '', true);
  try {
    const reply = await sendToClaude(text);
    const spokenText = renderAiText(aiBubble, reply, risk === 'crisis');
    speakText(spokenText);
  } catch (err) {
    aiBubble.innerHTML = '잠시 연결이 원활하지 않아요. 다시 시도해주세요 🙏';
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event('submit'));
  }
});

// ============ 음성 기능 (브라우저 내장 API, 별도 비용 없음) ============
const micBtn = document.getElementById('micBtn');
const voiceToggle = document.getElementById('voiceToggle');
const wakeModeBtn = document.getElementById('wakeModeBtn');
const wakeStatus = document.getElementById('wakeStatus');
const wakeHelp = document.getElementById('wakeHelp');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

let voiceEnabled = true;      // 올리브 답변을 음성으로 읽어줄지
let wakeModeOn = false;       // "안녕 올리브" 웨이크워드 대기 모드 on/off
let listeningState = 'idle';  // idle | wake | responding | capture
let recognition = null;       // 마이크 권한 재요청을 막기 위해, 처음 한 번만 만들고 계속 재사용해요.
let recognitionActive = false;

const WAKE_PATTERNS = [/안녕\s*올리브/, /하이\s*올리브/, /헬로\s*올리브/, /올리브야/, /올리브\s*안녕/];

if (!SpeechRecognitionAPI) {
  micBtn.style.display = 'none';
  wakeModeBtn.style.display = 'none';
  wakeHelp.textContent = '이 브라우저는 음성 인식을 지원하지 않아요. 아래 입력창에 글씨로 적어주세요.';
}

// --- 음성 합성 (TTS) ---
function pickFemaleKoreanVoice() {
  const voices = window.speechSynthesis.getVoices();
  const korean = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ko'));
  const preferred = korean.find(v => /female|여성|유나|서현|지민|성연/i.test(v.name));
  return preferred || korean[0] || null;
}

function speak(text, onEnd) {
  if (!('speechSynthesis' in window) || !text) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.92;
  utter.pitch = 1.05;
  const voice = pickFemaleKoreanVoice();
  if (voice) utter.voice = voice;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

// 올리브의 채팅 답변을 읽어줄 때 쓰는 함수 — 웨이크워드 모드면 다 읽은 뒤 다시 대기 상태로 돌아가요.
function speakText(text) {
  stopRecognitionSafely(); // 올리브가 말하는 동안엔 마이크를 잠깐 꺼서, 자기 목소리를 다시 듣지 않게 해요.
  if (!voiceEnabled) { if (wakeModeOn) setListeningMode('wake'); return; }
  speak(text, () => { if (wakeModeOn) setListeningMode('wake'); });
}

// --- 마이크 권한은 최초 1회만 — 인식 객체를 새로 만들지 않고 계속 재사용해요 ---
function getRecognition() {
  if (recognition) return recognition;
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    const lastResult = e.results[e.results.length - 1];
    const transcript = lastResult[0].transcript;

    if (listeningState === 'wake') {
      if (WAKE_PATTERNS.some(p => p.test(transcript))) {
        listeningState = 'responding';
        wakeModeBtn.classList.remove('listening');
        wakeStatus.textContent = '';
        stopRecognitionSafely(); // "네, 말씀하세요"를 마이크가 다시 듣지 않도록 먼저 멈춰요.
        speak('네, 말씀하세요', () => setListeningMode('capture'));
      }
    } else if (listeningState === 'capture' && lastResult.isFinal) {
      input.value = transcript;
      setListeningMode('idle');
      form.dispatchEvent(new Event('submit'));
    }
  };

  recognition.onerror = (e) => {
    // 무음(no-speech)이나 일시적 네트워크 에러는 흔해서 무시하고 계속 듣게 둬요.
    if (e.error === 'not-allowed' || e.error === 'permission-denied') {
      wakeHelp.style.display = 'block';
      wakeHelp.textContent = '마이크 권한이 꺼져있어요. 브라우저 설정에서 마이크 허용으로 바꿔주세요.';
      wakeModeOn = false;
      listeningState = 'idle';
      wakeModeBtn.classList.remove('active', 'listening');
      wakeModeBtn.textContent = '👂 "안녕 올리브"로 시작하기';
    }
  };

  recognition.onend = () => {
    recognitionActive = false;
    // 대기(wake) 상태를 유지해야 하는데 인식이 멈췄으면, 같은 객체로 바로 다시 시작해요.
    // (매번 새로 만들지 않아서 권한을 또 묻지 않아요.)
    if (wakeModeOn && (listeningState === 'wake' || listeningState === 'capture')) {
      startRecognitionSafely();
    }
  };

  return recognition;
}

function startRecognitionSafely() {
  const rec = getRecognition();
  if (recognitionActive) return;
  try {
    rec.start();
    recognitionActive = true;
  } catch (err) { /* 이미 시작된 경우 등은 무시 */ }
}

function stopRecognitionSafely() {
  if (recognition && recognitionActive) {
    try { recognition.stop(); } catch (err) {}
  }
}

// listeningState를 바꾸고, 그에 맞는 화면 표시 + 인식 시작을 한 번에 처리해요.
function setListeningMode(mode) {
  listeningState = mode;
  if (mode === 'wake') {
    wakeModeBtn.classList.add('listening');
    micBtn.classList.remove('listening');
    wakeStatus.textContent = '듣고 있어요...';
    startRecognitionSafely();
  } else if (mode === 'capture') {
    wakeModeBtn.classList.remove('listening');
    micBtn.classList.add('listening');
    wakeStatus.textContent = '지금 말씀하세요...';
    startRecognitionSafely();
  } else { // idle
    wakeModeBtn.classList.remove('listening');
    micBtn.classList.remove('listening');
    wakeStatus.textContent = '';
  }
}

// --- 버튼 이벤트 ---
wakeModeBtn.addEventListener('click', () => {
  wakeModeOn = !wakeModeOn;
  wakeModeBtn.textContent = wakeModeOn ? '👂 대기 중 (끄려면 클릭)' : '👂 "안녕 올리브"로 시작하기';
  wakeModeBtn.classList.toggle('active', wakeModeOn);
  wakeHelp.style.display = wakeModeOn ? 'none' : 'block'; // 켜지면 안내문은 접어서 화면을 덜 복잡하게
  if (wakeModeOn) {
    setListeningMode('wake');
  } else {
    setListeningMode('idle');
    stopRecognitionSafely();
    window.speechSynthesis.cancel();
  }
});

micBtn.addEventListener('click', () => {
  if (listeningState === 'capture') {
    stopRecognitionSafely();
    setListeningMode(wakeModeOn ? 'wake' : 'idle');
    return;
  }
  if (listeningState !== 'idle') return; // 웨이크워드 응답 중 등 다른 작업 중이면 무시
  setListeningMode('capture');
});

voiceToggle.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  voiceToggle.textContent = voiceEnabled ? '🔊' : '🔇';
  voiceToggle.classList.toggle('muted', !voiceEnabled);
  if (!voiceEnabled) window.speechSynthesis.cancel();
});
</script>
</body>
