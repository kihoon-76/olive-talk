<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E5F32">
<title>올리브톡 - 마음 기록</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --cream: #F6F1E4; --ink: #3A3423; --ink-soft: #6E6650;
    --olive-deep: #4E5F32; --olive: #7A8C4E; --olive-light: #9CB06A;
    --gold: #B8963E; --walnut: #8B5E3C; --card: #FFFDF8; --border: #E1D8BE;
    --mood-good: #E8B84B; --mood-calm: #7A8C4E; --mood-tired: #C9A876;
    --mood-worry: #D98B6B; --mood-anx: #C7A0D8; --mood-angry: #C96B5C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--cream); font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink); display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 420px; min-height: 100dvh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #FBF8EF 0%, var(--cream) 55%); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 4px; }
  .topbar h1 { font-family: 'Gowun Batang', serif; font-size: 21px; margin: 0; color: var(--olive-deep); }
  .topbar p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .cal-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; }

  main { padding: 14px 18px 30px; flex: 1; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-head .title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .card-head .range { font-size: 12px; color: var(--ink-soft); }

  .week-row { display: flex; justify-content: space-between; padding: 4px 2px 2px; margin-bottom: 4px; position: relative; }
  .week-row::before { content:''; position:absolute; left:24px; right:24px; top:22px; height:1px; background: var(--border); z-index:0; }
  .day-col { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1; }
  .mood-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; background: var(--card); border: 2px solid var(--border); }
  .day-label { font-size: 11px; color: var(--ink-soft); }
  .day-col.today .day-label { color: var(--olive-deep); font-weight: 700; }

  .donut-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .donut-wrap { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
  .donut-wrap .center-label { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .center-label .pct { font-family: 'Gowun Batang', serif; font-size: 24px; color: var(--olive-deep); font-weight: 700; }
  .center-label .name { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .legend-item .lbl { display: flex; align-items: center; gap: 7px; color: var(--ink); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .legend-item .val { font-weight: 600; color: var(--ink); }

  .encourage { background: linear-gradient(135deg, #EEF2E2, #F6F1E4); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .encourage svg { width: 54px; height: 54px; flex-shrink: 0; }
  .encourage .txt strong { display: block; font-family: 'Gowun Batang', serif; font-size: 15.5px; color: var(--olive-deep); margin-bottom: 4px; }
  .encourage .txt span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

  .nudge { display: none; background: #FBF0EC; border: 1px solid #E9CFC2; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .nudge.show { display: block; }
  .nudge p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; color: var(--walnut); }
  .nudge .res { font-size: 12px; color: var(--walnut); font-weight: 600; }

  .btn-primary {
    width: 100%; background: var(--olive-deep); color: #FBF8EF; border: none; border-radius: 999px;
    padding: 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation; min-height: 44px;
  }

  nav.bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px;
    background: rgba(251,248,239,0.96); border-top: 1px solid var(--border); display: flex;
    padding: 10px 10px calc(env(safe-area-inset-bottom,8px) + 8px); backdrop-filter: blur(6px); }
  nav.bottom .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px;
    color: var(--ink-soft); min-height: 44px; justify-content: center; text-decoration: none; }
  nav.bottom .item.active { color: var(--olive-deep); font-weight: 700; }
  nav.bottom .item svg { width: 20px; height: 20px; }
  main { padding-bottom: 90px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>마음 기록</h1>
      <p>기록할수록, 마음이 더 가벼워져요.</p>
    </div>
    <div class="cal-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#4E5F32" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="#4E5F32" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <main>
    <div class="card">
      <div class="card-head">
        <span class="title">📊 이번 주 내 마음</span>
        <span class="range">8.10(월) ~ 8.16(일)</span>
      </div>

      <div class="week-row" id="weekRow"></div>

      <div class="donut-row">
        <div class="donut-wrap">
          <svg viewBox="0 0 120 120" width="130" height="130">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#EFE8D6" stroke-width="14"/>
            <circle id="donutArc" cx="60" cy="60" r="50" fill="none" stroke="#7A8C4E" stroke-width="14"
              stroke-dasharray="0 314" stroke-linecap="round" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="center-label">
            <div class="pct" id="donutPct">0%</div>
            <div class="name" id="donutName">-</div>
          </div>
        </div>
        <div class="legend" id="legendList"></div>
      </div>
    </div>

    <div class="nudge" id="nudgeCard">
      <p>요즘 며칠 마음이 계속 무거우셨던 것 같아요. 그런 날들이 이어질 땐, 곁에 있는 누군가와 이야기 나누는 것도 큰 힘이 돼요.</p>
      <div class="res">📞 정신건강 위기상담전화 1577-0199 · 언제든 편하게</div>
    </div>

    <div class="encourage">
      <svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="238" cy="50" rx="22" ry="11" fill="#9CB06A" transform="rotate(-25 238 50)"/>
        <ellipse cx="210" cy="45" rx="19" ry="9" fill="#B7CE8C" transform="rotate(15 210 45)"/>
        <ellipse cx="200" cy="230" rx="98" ry="118" fill="#A9BE78"/>
        <ellipse cx="163" cy="182" rx="26" ry="38" fill="#fff" opacity="0.25"/>
        <circle cx="172" cy="228" r="8" fill="#3A3423"/><circle cx="228" cy="228" r="8" fill="#3A3423"/>
        <path d="M180 258 Q200 270 220 258" stroke="#3A3423" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="txt" id="encourageText">
        <strong>이번 주도 잘 버텨냈어요.</strong>
        <span>작은 변화들이 쌓여 마음의 힘이 되고 있어요.</span>
      </div>
    </div>

    <button class="btn-primary" onclick="alert('지난 기록 상세 화면(데모에는 미포함)')">
      📖 기록 돌아보기
    </button>
  </main>

  <nav class="bottom">
    <a href="olivetalk_home.html" class="item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>홈</a>
    <div class="item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>대화</div>
    <div class="item active"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-6-4-6 4V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>기록</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.3.9a7 7 0 00-2-1.2L14 3h-4l-.6 2.5a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.3-.9a7 7 0 002 1.2L10 21h4l.6-2.5a7 7 0 002-1.2l2.3.9 2-3.4-2-1.6a7 7 0 00.1-1.2z" stroke="currentColor" stroke-width="1.4"/></svg>설정</div>
  </nav>
</div>

<script>
const MOODS = {
  good:  { emoji: '😊', label: '좋아요',  color: '#E8B84B' },
  calm:  { emoji: '😌', label: '평온해요', color: '#7A8C4E' },
  tired: { emoji: '😐', label: '피곤해요', color: '#C9A876' },
  worry: { emoji: '😟', label: '걱정돼요', color: '#D98B6B' },
  sad:   { emoji: '😔', label: '우울해요', color: '#B79BC7' },
  anx:   { emoji: '😰', label: '불안해요', color: '#C7A0D8' },
  angry: { emoji: '😠', label: '화나요',  color: '#C96B5C' },
};

// --- Supabase 연동 ---
const SUPABASE_URL = 'https://lovyadxzfsvccjknvrzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VYij2JgCTIEPkNgs-0rCmQ_Cq2r-XSf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

function getThisWeekDates() {
  // 이번 주 월요일 ~ 오늘까지의 날짜 배열(YYYY-MM-DD)을 만들어요.
  const today = new Date();
  const dow = today.getDay(); // 0=일 ... 6=토
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayOffset);

  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().slice(0, 10));
  }
  return dates;
}

async function loadWeekData() {
  // 테스트 기간: 로그인 안 되어있으면 로그인창을 띄우지 않고, 그냥 "기록 없음" 상태로 보여줘요.
  const { data: { session } } = await sb.auth.getSession();
  const dates = getThisWeekDates();
  const todayStr = new Date().toISOString().slice(0, 10);

  let logsByDate = {};
  let loadFailed = false;
  if (session) {
    const { data, error } = await sb.from('mood_logs')
      .select('logged_date, mood_key')
      .eq('user_id', session.user.id)
      .in('logged_date', dates);
    if (error) { console.error(error); loadFailed = true; }
    else data.forEach(row => { logsByDate[row.logged_date] = row.mood_key; });
  }
  // session이 없어도 loadFailed는 true로 만들지 않아요 — 에러가 아니라 "아직 로그인 전"인 정상 상태예요.

  // 아직 기록이 없는 날은 화면이 비어보이지 않도록 'tired'(중립)로 표시하되,
  // 실제 집계(도넛차트 등)에서는 기록 없는 날은 제외해요.
  const weekData = dates.map(dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    const label = DAY_LABELS[d.getDay()];
    const hasLog = !!logsByDate[dateStr];
    return {
      label,
      mood: logsByDate[dateStr] || null,
      today: dateStr === todayStr,
      hasLog,
    };
  });
  return { weekData, loadFailed };
}

(async function init() {
  const { weekData, loadFailed } = await loadWeekData();

  if (loadFailed) {
    document.getElementById('donutName').textContent = '불러오기 실패';
    document.getElementById('encourageText').innerHTML =
      '<strong>기록을 불러오지 못했어요.</strong><span>인터넷 연결을 확인하고 새로고침해주세요.</span>';
    document.getElementById('legendList').innerHTML =
      '<div style="font-size:12px;color:var(--walnut);">⚠️ 네트워크 오류로 이번 주 기록을 가져오지 못했어요.</div>';
    return;
  }

  const weekRow = document.getElementById('weekRow');
  weekData.forEach(d => {
    const m = d.mood ? MOODS[d.mood] : null;
    const col = document.createElement('div');
    col.className = 'day-col' + (d.today ? ' today' : '');
    col.innerHTML = m
      ? `<div class="mood-dot" style="border-color:${m.color}">${m.emoji}</div><div class="day-label">${d.label}</div>`
      : `<div class="mood-dot" style="opacity:0.35">–</div><div class="day-label">${d.label}</div>`;
    weekRow.appendChild(col);
  });

  const logged = weekData.filter(d => d.hasLog);
  if (logged.length === 0) {
    document.getElementById('donutName').textContent = '기록 없음';
    document.getElementById('encourageText').innerHTML =
      '<strong>아직 이번 주 기록이 없어요.</strong><span>홈 화면에서 오늘 기분을 골라보세요.</span>';
    return;
  }

  const counts = {};
  logged.forEach(d => counts[d.mood] = (counts[d.mood] || 0) + 1);
  const total = logged.length;
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const [topMoodKey, topCount] = sorted[0];
  const topPct = Math.round(topCount / total * 100);

  document.getElementById('donutPct').textContent = topPct + '%';
  document.getElementById('donutName').textContent = MOODS[topMoodKey].label;

  const circumference = 2 * Math.PI * 50;
  const arc = document.getElementById('donutArc');
  arc.style.stroke = MOODS[topMoodKey].color;
  arc.setAttribute('stroke-dasharray', `${circumference * topPct/100} ${circumference}`);

  const legendList = document.getElementById('legendList');
  sorted.forEach(([key, cnt]) => {
    const pct = Math.round(cnt/total*100);
    const m = MOODS[key];
    const row = document.createElement('div');
    row.className = 'legend-item';
    row.innerHTML = `<span class="lbl"><span class="legend-dot" style="background:${m.color}"></span>${m.label}</span><span class="val">${pct}%</span>`;
    legendList.appendChild(row);
  });

  const negativeCount = (counts.worry||0) + (counts.anx||0) + (counts.angry||0) + (counts.sad||0);
  if (negativeCount / total >= 0.5) {
    document.getElementById('nudgeCard').classList.add('show');
    document.getElementById('encourageText').innerHTML =
      '<strong>이번 주, 마음이 많이 무거우셨죠.</strong><span>혼자 견디지 않으셔도 괜찮아요. 올리브가 곁에 있을게요.</span>';
  }
})();
</script>
</body>
</html>
