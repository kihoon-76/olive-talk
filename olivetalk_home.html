<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E5F32">
<title>올리브톡 - 홈</title>

<!-- 카카오톡 등 SNS 공유 시 노출되는 정보 (Open Graph) -->
<meta property="og:type" content="website">
<meta property="og:title" content="올리브톡 - 오늘 마음은 어떠세요?">
<meta property="og:description" content="성경에 기반한 마음 위로 & 무드 기록, 올리브와 함께해요">
<meta property="og:image" content="https://olivetalk-app.netlify.app/olivetalk_og_thumbnail.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://olivetalk-app.netlify.app/olivetalk_home.html">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --cream: #F6F1E4;
    --cream-deep: #EFE8D6;
    --ink: #3A3423;
    --ink-soft: #6E6650;
    --olive-deep: #4E5F32;
    --olive: #7A8C4E;
    --olive-light: #9CB06A;
    --gold: #B8963E;
    --walnut: #8B5E3C;
    --card: #FFFDF8;
    --border: #E1D8BE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior-y: contain; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #FBF8EF 0%, var(--cream) 55%);
    position: relative;
  }

  .top-tagline {
    text-align: center; font-size: 11.5px; font-weight: 600; color: var(--gold);
    letter-spacing: 0.2px; padding: 10px 0 0;
  }

  /* top bar */
  .topbar {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 20px 20px 4px;
  }
  .logo-word {
    grid-column: 2;
    text-align: center;
    font-family: 'Gowun Batang', serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--olive-deep);
  }
  .profile-btn {
    grid-column: 3;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    touch-action: manipulation;
    text-decoration: none;
  }

  main { padding: 4px 18px 100px; flex: 1; }

  /* greeting */
  .greet-block { text-align: center; padding: 10px 8px 4px; }
  .greet-block h1 { font-family: 'Gowun Batang', serif; font-size: 25px; color: var(--ink); margin: 0 0 8px; letter-spacing: -0.3px; }
  .greet-block p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; }

  /* intro tab - 올리브 소개로 이동하는 눈에 띄는 탭 버튼 */
  .intro-tab {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 auto;
    background: var(--card); border: 2px solid var(--olive-light); color: var(--olive-deep);
    font-size: 12.5px; font-weight: 700; text-decoration: none;
    padding: 9px 18px; border-radius: 999px; touch-action: manipulation;
    box-shadow: 0 3px 8px rgba(78,95,50,0.10);
  }
  .intro-tab-wrap { text-align: center; }

  /* illustration stage */
  .illust-stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 22px 0 10px;
    margin-bottom: 6px;
  }
  .arch-glow {
    position: absolute; width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, #EAF0DC 0%, rgba(234,240,220,0) 72%);
    z-index: 0;
  }
  .leaf-deco { position: absolute; opacity: 0.55; z-index: 0; }
  .leaf-deco.left { left: -6px; top: 6px; width: 74px; transform: rotate(-18deg); }
  .leaf-deco.right { right: -10px; bottom: 4px; width: 90px; transform: rotate(16deg); }
  .big-olive { width: 190px; height: auto; position: relative; z-index: 1; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.03) rotate(-1deg);} }
  .sparkle {
    position: absolute; z-index: 2; font-size: 16px; pointer-events: none;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .sparkle.s1 { top: 8px; left: 30px; font-size: 14px; animation-delay: 0s; }
  .sparkle.s2 { top: 60px; right: 60px; font-size: 12px; animation-delay: 0.8s; }
  .sparkle.s3 { bottom: 60px; left: 20px; font-size: 15px; animation-delay: 1.5s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
  }
  .deco-bubble, .deco-heart {
    position: absolute; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    box-shadow: 0 4px 10px rgba(78,95,50,0.08);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .deco-bubble { top: 18px; right: 26px; }
  .deco-heart { bottom: 28px; right: 8px; width: 34px; height: 34px; font-size: 15px; animation-delay: 0.6s; }

  .mood-prompt { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 4px 0 12px; }
  .mood-prompt .leaf-emoji { opacity: 0.7; }

  /* mood selector */
  .mood-select-row {
    display: flex; justify-content: space-between; gap: 6px;
    margin-bottom: 18px;
  }
  .mood-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: var(--card); border: 2px solid var(--border); border-radius: 16px;
    padding: 10px 4px; font-family: 'Noto Sans KR', sans-serif; font-size: 10.5px; color: var(--ink-soft);
    touch-action: manipulation; min-height: 44px;
    transition: transform 0.15s ease;
  }
  .mood-btn span { font-size: 20px; display: inline-block; }
  .mood-btn.selected {
    background: #EAF0DC; border-color: var(--olive); color: var(--olive-deep); font-weight: 700;
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .mood-confirm {
    display: block; text-align: center; font-size: 12px; color: var(--olive-deep); font-weight: 600;
    text-decoration: none; background: #EAF0DC; border-radius: 12px; padding: 10px; margin-bottom: 14px;
  }
  .mood-error {
    text-align: center; font-size: 12px; color: var(--walnut); font-weight: 600;
    background: #FBF0EC; border: 1px solid #E9CFC2; border-radius: 12px; padding: 10px; margin-bottom: 14px;
  }

  /* big CTA */
  .cta-big {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--olive-deep); color: #FBF8EF; text-decoration: none;
    font-size: 15.5px; font-weight: 700; padding: 16px; border-radius: 999px;
    touch-action: manipulation; min-height: 44px;
    box-shadow: 0 6px 16px rgba(78,95,50,0.22);
  }

  /* about link */
  .about-link {
    display: block; text-align: center; margin-top: 14px; font-size: 12.5px;
    color: var(--gold); font-weight: 600; text-decoration: none;
  }

  /* section label */
  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 22px 2px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label a { color: var(--gold); font-size: 12px; font-weight: 500; text-decoration: none; }

  /* bottom nav */
  nav.bottom {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: rgba(251,248,239,0.96);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 10px calc(env(safe-area-inset-bottom,8px) + 8px);
    backdrop-filter: blur(6px);
  }
  nav.bottom .item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10.5px;
    color: var(--ink-soft);
    min-height: 44px;
    justify-content: center;
    touch-action: manipulation;
    text-decoration: none;
  }
  nav.bottom .item.active { color: var(--olive-deep); font-weight: 700; }
  nav.bottom .item svg { width: 21px; height: 21px; }
</style>
</head>
<body>
<div class="app">

  <p class="top-tagline">성경에 기반한 마음힐링 AI대화</p>

  <div class="topbar">
    <div></div>
    <div class="logo-word">올리브톡</div>
    <div class="profile-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#4E5F32" stroke-width="1.6"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#4E5F32" stroke-width="1.6"/></svg>
    </div>
  </div>

  <main>
    <div class="greet-block">
      <h1>오늘 마음은 어떠세요?</h1>
      <p>올리브와 함께 마음을 나눠봐요 ❤️</p>
      <div class="intro-tab-wrap">
        <a href="olivetalk_about.html" class="intro-tab">🫒 올리브 소개</a>
      </div>
    </div>

    <div class="illust-stage">
      <div class="arch-glow"></div>
      <svg class="leaf-deco left" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="30" rx="48" ry="20" fill="#DCE6C6"/>
      </svg>
      <svg class="leaf-deco right" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="30" rx="48" ry="20" fill="#DCE6C6"/>
      </svg>

      <svg class="big-olive" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
        <!-- stem & leaves -->
        <path d="M200 95 Q212 72 228 58" stroke="#6B5B3E" stroke-width="8" fill="none" stroke-linecap="round"/>
        <ellipse cx="238" cy="50" rx="22" ry="11" fill="#9CB06A" transform="rotate(-25 238 50)"/>
        <ellipse cx="210" cy="45" rx="19" ry="9" fill="#B7CE8C" transform="rotate(15 210 45)"/>

        <!-- tiny bow accessory -->
        <path d="M188 78 L172 66 L176 82 Z" fill="#D98B6B"/>
        <path d="M188 78 L204 66 L200 82 Z" fill="#D98B6B"/>

        <!-- body -->
        <ellipse cx="200" cy="235" rx="102" ry="120" fill="#A9BE78"/>
        <ellipse cx="160" cy="185" rx="28" ry="40" fill="#FFFFFF" opacity="0.28"/>

        <!-- feet -->
        <ellipse cx="168" cy="350" rx="20" ry="11" fill="#7A8C4E"/>
        <ellipse cx="232" cy="350" rx="20" ry="11" fill="#7A8C4E"/>

        <!-- arms -->
        <path d="M104 240 Q86 226 82 202" stroke="#7A8C4E" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M296 240 Q314 226 318 202" stroke="#7A8C4E" stroke-width="12" fill="none" stroke-linecap="round"/>

        <!-- big sparkly eyes -->
        <circle cx="168" cy="230" r="12" fill="#3A3423"/>
        <circle cx="232" cy="230" r="12" fill="#3A3423"/>
        <circle cx="164" cy="225" r="3.5" fill="#FFFFFF"/>

        <!-- rosy cheeks -->
        <ellipse cx="146" cy="252" rx="16" ry="9" fill="#E8967D" opacity="0.5"/>

      <!-- sparkle decorations -->

      <div class="deco-bubble">💬</div>

    <p class="mood-prompt"><span class="leaf-emoji">🍃</span> 지금 내 기분을 선택해 보세요 <span class="leaf-emoji">🍃</span></p>

    <div class="mood-select-row" id="moodSelectRow">
      <button class="mood-btn" data-mood="good"  data-emoji="😊" data-label="좋아요"><span>😊</span>좋아요</button>
      <button class="mood-btn" data-mood="calm"  data-emoji="😌" data-label="평온해요"><span>😌</span>평온해요</button>
      <button class="mood-btn" data-mood="sad"   data-emoji="😔" data-label="우울해요"><span>😔</span>우울해요</button>
      <button class="mood-btn" data-mood="anx"   data-emoji="😰" data-label="불안해요"><span>😰</span>불안해요</button>
      <button class="mood-btn" data-mood="angry" data-emoji="😠" data-label="화나요"><span>😠</span>화나요</button>

    <a href="olivetalk_mood_record.html" class="mood-confirm" id="moodConfirm" style="display:none;">
      오늘의 기분이 마음 기록에 저장됐어요 · 확인하러 가기 →

    <div class="mood-error" id="moodError" style="display:none;">
      ⚠️ 저장에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요.

    <a href="olivetalk_demo.html" class="cta-big">💬 올리브와 이야기하기</a>
  </main>

  <nav class="bottom">
    <div class="item active">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      홈

    <a href="olivetalk_demo.html" class="item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>

    <a href="olivetalk_mood_record.html" class="item">

      기록
    </a>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.3.9a7 7 0 00-2-1.2L14 3h-4l-.6 2.5a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.3-.9a7 7 0 002 1.2L10 21h4l.6-2.5a7 7 0 002-1.2l2.3.9 2-3.4-2-1.6a7 7 0 00.1-1.2z" stroke="currentColor" stroke-width="1.4"/></svg>
      설정

</div>

<script>
  // --- Supabase 연동 ---
  // 이 키는 "공개용(publishable)" 키라 클라이언트 코드에 노출돼도 안전해요.
  // 실제 데이터 보호는 DB의 RLS(Row Level Security) 정책이 담당해요.
  const SUPABASE_URL = 'https://lovyadxzfsvccjknvrzz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_VYij2JgCTIEPkNgs-0rCmQ_Cq2r-XSf';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function todayStr() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  }

  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('moodError').style.display = 'none';
      btn.disabled = true;

      // 테스트 기간: 로그인 안 되어있으면 서버 저장은 조용히 건너뛰고, 화면 선택 표시만 해줘요.
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        btn.disabled = false;
        document.getElementById('moodConfirm').style.display = 'block';
        return;
      }

      const { error } = await sb.from('mood_logs').upsert({
        user_id: session.user.id,
        mood_key: btn.dataset.mood,
        logged_date: todayStr(),
      }, { onConflict: 'user_id,logged_date' });

      btn.disabled = false;
      if (error) {
        console.error('기분 저장 실패:', error);
        document.getElementById('moodError').style.display = 'block';
        document.getElementById('moodConfirm').style.display = 'none';
      } else {
        document.getElementById('moodConfirm').style.display = 'block';
      }
    });
  });

  // 페이지 로드 시, 오늘 이미 저장된 기분이 있으면 선택 표시 복원
  (async function restoreTodayMood() {
    const session = await ensureSession();
    if (!session) return;
    const { data, error } = await sb.from('mood_logs')
      .select('mood_key')
      .eq('user_id', session.user.id)
      .eq('logged_date', todayStr())
      .maybeSingle();
    if (error) { console.error(error); return; }
    if (data) {
      const btn = document.querySelector(`.mood-btn[data-mood="${data.mood_key}"]`);
      if (btn) { btn.classList.add('selected'); document.getElementById('moodConfirm').style.display = 'block'; }
    }
  })();
</script>
</body>
